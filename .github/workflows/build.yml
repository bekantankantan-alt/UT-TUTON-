name: Build SOAL UT TUTON V23 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK V23
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Single ZIP
        run: |
          test -f SOAL_UT_TUTON_SINGLE_ZIP_V23_APK.zip

          mkdir -p project

          unzip -q SOAL_UT_TUTON_SINGLE_ZIP_V23_APK.zip -d project

          SETTINGS=$(find project \
            -name settings.gradle \
            -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Download PDF and DOCX Libraries
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/vendor"

          curl -fL --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o "$PROJECT_DIR/app/src/main/assets/vendor/pdf.min.js"

          curl -fL --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o "$PROJECT_DIR/app/src/main/assets/vendor/pdf.worker.min.js"

          curl -fL --retry 3 \
            https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js \
            -o "$PROJECT_DIR/app/src/main/assets/vendor/mammoth.browser.min.js"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOAL-UT-TUTON-V23-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
