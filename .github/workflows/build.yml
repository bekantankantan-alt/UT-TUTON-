name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Download Offline Libraries
        run: |
          mkdir -p app/src/main/assets/vendor

          curl -fL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o app/src/main/assets/vendor/pdf.min.js

          curl -fL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o app/src/main/assets/vendor/pdf.worker.min.js

          curl -fL https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js \
            -o app/src/main/assets/vendor/mammoth.browser.min.js

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOAL-UT-TUTON-APK
          path: app/build/outputs/apk/debug/*.apk
