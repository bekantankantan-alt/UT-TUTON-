name: Build SOAL UT TUTON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmdline-tools;latest

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract Single ZIP
        run: |
          unzip -q SOAL_UT_TUTON_SINGLE_ZIP_V21_APK.zip -d project

          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle

      - name: Download PDF.js and Mammoth
        run: |
          mkdir -p project/app/src/main/assets/vendor

          curl -fL --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o project/app/src/main/assets/vendor/pdf.min.js

          curl -fL --retry 3 \
            https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js \
            -o project/app/src/main/assets/vendor/mammoth.browser.min.js

          test -s project/app/src/main/assets/vendor/pdf.min.js
          test -s project/app/src/main/assets/vendor/mammoth.browser.min.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOAL-UT-TUTON-V21-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
