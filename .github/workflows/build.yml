name: Build SOAL UT TUTON V21 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Single ZIP
        run: |
          unzip -q SOAL_UT_TUTON_SINGLE_ZIP_V21_APK.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Download Offline Libraries
        run: |
          mkdir -p project/app/src/main/assets/vendor

          curl -fL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
          -o project/app/src/main/assets/vendor/pdf.min.js

          curl -fL https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
          -o project/app/src/main/assets/vendor/pdf.worker.min.js

          curl -fL https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js \
          -o project/app/src/main/assets/vendor/mammoth.browser.min.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOAL-UT-TUTON-V21-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
