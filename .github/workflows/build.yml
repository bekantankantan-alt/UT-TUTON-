name: Build SOAL UT TUTON V25 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SOAL_UT_TUTON_V25_HTML_DRAFT.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V25 project ZIP
        run: |
          test -f SOAL_UT_TUTON_V25_HTML_DRAFT.zip
          mkdir -p project
          unzip -q SOAL_UT_TUTON_V25_HTML_DRAFT.zip -d project

          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP V25"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download PDF.js and Mammoth
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets/vendor"

          curl -fL --retry 3 --retry-delay 2             https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js             -o "$PROJECT_DIR/app/src/main/assets/vendor/pdf.min.js"

          curl -fL --retry 3 --retry-delay 2             https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js             -o "$PROJECT_DIR/app/src/main/assets/vendor/pdf.worker.min.js"

          curl -fL --retry 3 --retry-delay 2             https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js             -o "$PROJECT_DIR/app/src/main/assets/vendor/mammoth.browser.min.js"

          test -s "$PROJECT_DIR/app/src/main/assets/vendor/pdf.min.js"
          test -s "$PROJECT_DIR/app/src/main/assets/vendor/pdf.worker.min.js"
          test -s "$PROJECT_DIR/app/src/main/assets/vendor/mammoth.browser.min.js"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOAL-UT-TUTON-V25-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
